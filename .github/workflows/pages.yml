name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Report Pages result on the commit
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = '${{ needs.deploy.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              target_url: succeeded
                ? 'https://george-rd.github.io/cli-anything-meerk40t/'
                : '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              description: succeeded
                ? 'GitHub Pages deployed'
                : 'GitHub Pages deployment failed — inspect the workflow run',
              context: 'pages-deployment',
            });

name: Agent issue 59 final verification

on:
  push:
    branches:
      - feat/59-shared-status-integration

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify focused real-kernel status tracer
        run: python -m pytest cli_anything/meerk40t/tests/test_integration_status.py -q

      - name: Verify full suite
        run: python -m pytest cli_anything/meerk40t/tests/ -q

      - name: Compile Python sources
        run: python -m compileall -q cli_anything/meerk40t

name: MeerK40t compatibility

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released-runtime:
    name: released ${{ matrix.meerk40t-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        meerk40t-version:
          - "0.9.8220"
          - "0.9.8230"
          - "0.9.8930"
          - "0.9.9000"
          - "0.9.9100"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install harness against exact supported release
        env:
          MEERK40T_VERSION: ${{ matrix.meerk40t-version }}
        run: |
          python -m pip install --upgrade pip
          printf 'meerk40t==%s\n' "$MEERK40T_VERSION" > /tmp/meerk40t-constraint.txt
          PIP_CONSTRAINT=/tmp/meerk40t-constraint.txt python -m pip install -e . pytest

      - name: Confirm exact MeerK40t version
        env:
          MEERK40T_VERSION: ${{ matrix.meerk40t-version }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["MEERK40T_VERSION"]
          actual = version("meerk40t")
          print(f"MeerK40t {actual}")
          if actual != expected:
              raise SystemExit(f"expected {expected}, got {actual}")
          PY

      - name: Run canonical integration-seam tests
        run: python -m pytest cli_anything/meerk40t/tests/test_integration_status.py -q

      - name: Run behavioral compatibility gate
        run: |
          CLI_ANYTHING_FORCE_INSTALLED=1 python -m unittest \
            cli_anything.meerk40t.tests.test_core \
            cli_anything.meerk40t.tests.test_mk_plugin \
            cli_anything.meerk40t.tests.test_full_e2e

  upstream-main:
    name: upstream main (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install harness and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Install MeerK40t upstream main
        run: python -m pip install --force-reinstall "meerk40t @ git+https://github.com/meerk40t/meerk40t.git@main"

      - name: Report upstream version
        run: python -c 'from importlib.metadata import version; print("MeerK40t", version("meerk40t"))'

      - name: Run canonical integration-seam tests
        run: python -m pytest cli_anything/meerk40t/tests/test_integration_status.py -q

      - name: Run behavioral early-warning gate
        run: |
          CLI_ANYTHING_FORCE_INSTALLED=1 python -m unittest \
            cli_anything.meerk40t.tests.test_core \
            cli_anything.meerk40t.tests.test_mk_plugin \
            cli_anything.meerk40t.tests.test_full_e2e

name: Full PR verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install harness against newest supported release
        run: |
          python -m pip install --upgrade pip
          printf 'meerk40t==0.9.9100\n' > /tmp/meerk40t-constraint.txt
          PIP_CONSTRAINT=/tmp/meerk40t-constraint.txt python -m pip install -e . pytest

      - name: Run full test suite
        run: CLI_ANYTHING_FORCE_INSTALLED=1 python -m pytest cli_anything/meerk40t/tests -q

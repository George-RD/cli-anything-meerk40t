<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8efe8">
  <title>Job path not found — CLI Anything × MeerK40t</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .not-found__sheet { width: min(48rem, 100%); border: 1px solid var(--ink); background: var(--paper); padding: clamp(2rem, 6vw, 5rem); position: relative; box-shadow: 12px 12px 0 var(--shadow); }
    .not-found__sheet::before, .not-found__sheet::after { content: ""; position: absolute; width: 1rem; height: 1rem; border: solid var(--signal); }
    .not-found__sheet::before { top: .8rem; left: .8rem; border-width: 2px 0 0 2px; }
    .not-found__sheet::after { right: .8rem; bottom: .8rem; border-width: 0 2px 2px 0; }
    .not-found h1 { max-width: 9ch; margin: .5rem 0 1rem; font-size: clamp(3rem, 10vw, 6rem); line-height: .9; letter-spacing: -.045em; }
    .not-found p { max-width: 48ch; }
    .not-found .button { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main class="not-found">
    <section class="not-found__sheet">
      <p class="section-kicker">404 / PATH OUTSIDE BED</p>
      <h1>This job path does not exist.</h1>
      <p>Return to the project page to inspect the CLI, prepare flow, and operator boundary.</p>
      <a class="button button--primary" href="./">Return to project</a>
    </section>
  </main>
</body>
</html>
